<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bcWarmGrad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7BFC7" />
      <stop offset="50%" stop-color="#DF95B7" />
      <stop offset="100%" stop-color="#A178B9" />
    </linearGradient>
    <radialGradient id="bcGlow" cx="24%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#FFECE7" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#FFECE7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bcPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F6DDD7" />
    </linearGradient>
  </defs>

  <!-- Warm Rose-Quartz to Lilac Squircle -->
  <rect width="64" height="64" rx="18" fill="url(#bcWarmGrad)" />
  <rect width="64" height="64" rx="18" fill="url(#bcGlow)" />

  <!-- Sculpted Crescent "C" French Comb & Chignon Profile -->
  <g transform="rotate(-10 32 32)">
    <path
      d="M44.2 19.2C39 13.4 31.2 12 23.8 14.9C15.8 18.1 11.6 26.5 12.6 35.5C13.7 45 21.6 51.3 31.4 50.9C37.4 50.6 42 48 45.2 43.8"
      stroke="#FFF9F6"
      stroke-width="4.6"
      stroke-linecap="round"
    />

    <!-- Fine Swept Comb Tines Connected to the "C" Spine -->
    <path
      d="M16.2 22.8C22 22.6 27.6 23.2 32.8 24.4"
      stroke="#FFF9F6"
      stroke-width="2.1"
      stroke-linecap="round"
    />
    <path
      d="M13.8 29.2C20.2 28.9 26.6 29.4 32.5 30.6"
      stroke="#FFF9F6"
      stroke-width="2.1"
      stroke-linecap="round"
    />
    <path
      d="M13.6 35.6C20 35.3 26.2 35.8 31.8 36.8"
      stroke="#FFF9F6"
      stroke-width="2.1"
      stroke-linecap="round"
    />
    <path
      d="M16.2 41.8C21.6 41.6 26.6 42 30.8 42.9"
      stroke="#FFF9F6"
      stroke-width="2.0"
      stroke-linecap="round"
    />

    <!-- Detached Floating Pearl Pin Accent -->
    <circle cx="48.5" cy="24.5" r="2.7" fill="url(#bcPearl)" />
  </g>
</svg>
