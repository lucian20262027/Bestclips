<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BestClips - Curated Clips & Essentials</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">
  <!-- 顶部导航 -->
  <header class="bg-white border-b border-gray-200 py-4 px-6 flex justify-between items-center">
    <div class="text-xl font-bold tracking-tight text-indigo-600">BestClips</div>
    <nav class="space-x-4 text-sm text-gray-600">
      <a href="#" class="hover:text-indigo-600">Products</a>
      <a href="#" class="hover:text-indigo-600">About</a>
      <button class="bg-indigo-600 text-white px-3 py-1.5 rounded-md hover:bg-indigo-700">Cart (0)</button>
    </nav>
  </header>

  <!-- Hero 区域 -->
  <main class="max-w-4xl mx-auto px-4 py-16 text-center">
    <span class="inline-block bg-indigo-50 text-indigo-700 text-xs px-3 py-1 rounded-full font-medium mb-4">Under Active Development</span>
    <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 tracking-tight">
      Curated products, powered by community creators.
    </h1>
    <p class="mt-4 text-lg text-gray-600 max-w-2xl mx-auto">
      Welcome to BestClips. We connect high-converting creator showcases with verified merchant catalogs.
    </p>
    <div class="mt-8 flex justify-center gap-4">
      <button class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium shadow hover:bg-indigo-700 transition">Explore Catalog</button>
      <button class="bg-white border border-gray-300 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-50 transition">Merchant Portal</button>
    </div>
  </main>

  <!-- 底部页脚 -->
  <footer class="border-t border-gray-200 py-6 text-center text-sm text-gray-400">
    &copy; 2026 BestClips.app. Built with GitHub & Vercel.
  </footer>
</body>
</html>
